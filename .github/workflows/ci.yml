name: Catalove CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalove-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Run PostgreSQL migration and isolation tests
        run: npm run test:tenant-db

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://catalove-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
          NEXT_PUBLIC_CATALOVE_SUPABASE_PROJECT_REF: catalove-ci

      - name: Smoke test standalone production server
        run: node scripts/smoke-standalone.mjs
